<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameSearch</title>
<style>
:root{--bg:#090909;--panel:#111;--orange:#ff6a00;--muted:#a5a5a5}
*{box-sizing:border-box} body{margin:0;background:#090909;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;background:#090909}
.logo{font-size:23px;font-weight:800}.logo span{color:var(--orange)}
nav a{color:#bbb;text-decoration:none;margin-left:25px;font-size:14px}nav a:hover{color:#fff}
main{max-width:1100px;margin:auto;padding:110px 22px}
.hero{text-align:center}.hero h1{font-size:72px;letter-spacing:-3px;margin:0 0 28px}.hero h1 span{color:var(--orange)}
.hero p{color:var(--muted);font-size:16px;margin-bottom:28px}
.search{max-width:620px;margin:auto;display:flex;align-items:center;background:#151515;border:1px solid #444;border-radius:28px;padding:5px 7px;box-shadow:0 2px 15px #000}
.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:16px;padding:13px}.search button,.play{border:0;background:var(--orange);color:#111;font-weight:800;border-radius:22px;padding:11px 20px;cursor:pointer}.search button:hover,.play:hover{filter:brightness(1.15)}
.categories{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:35px 0}.cat{background:#141414;border:1px solid #292929;color:#ccc;border-radius:999px;padding:9px 16px;cursor:pointer}.cat.active,.cat:hover{border-color:var(--orange);color:#fff}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:55px 0 18px}.section-title h2{margin:0}.section-title small{color:#777}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:linear-gradient(145deg,#151515,#0e0e0e);border:1px solid #282828;border-radius:16px;padding:20px;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#733000}
.icon{height:110px;border-radius:12px;background:linear-gradient(135deg,#271100,#ff6a00);display:grid;place-items:center;font-size:45px;margin-bottom:15px}
.card h3{margin:7px 0}.card p{color:#999;font-size:13px;line-height:1.5}.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.tag{font-size:12px;color:#ff914d}
.play{padding:9px 14px;font-size:12px}
.empty{display:none;text-align:center;color:#888;padding:40px}
footer{text-align:center;color:#666;border-top:1px solid #222;padding:28px;margin-top:60px}
</style>
</head>
<body>
<header><div class="logo">Thriller <span>Games</span></div><nav><a href="#">Inicio</a><a href="#juegos">Juegos</a><a href="#categorias">Categorías</a></nav></header>
<main>
<section class="hero">
<h1>Busca tu próximo <span>juego</span></h1>
<p>Explora juegos, categorías y descubre algo nuevo para jugar.</p>
<div class="search"><span style="color:#777;padding:0 8px;font-size:18px">⌕</span><input id="search" placeholder="Buscar en Thriller Browser..." autocomplete="off"><button onclick="buscar()">Buscar</button></div>
<div id="browserResults" style="max-width:700px;margin:14px auto 0;text-align:left"></div>
<div style="margin-top:18px;display:flex;gap:10px;justify-content:center">
<button class="cat" onclick="buscar()">Búsqueda de juegos</button>
<button class="cat" onclick="openSnake()">Voy a tener suerte</button>
</div>
</section>
<div class="categories" id="categorias">
<button class="cat active" data-cat="Todos">Todos</button><button class="cat" data-cat="Acción">Acción</button><button class="cat" data-cat="Carreras">Carreras</button><button class="cat" data-cat="Aventura">Aventura</button><button class="cat" data-cat="Roblox">Roblox</button>
</div>
<section id="juegos"><div class="section-title"><h2>Jugar ahora</h2><small id="count"></small></div><div class="grid" id="grid"></div><div class="empty" id="empty">No encontramos ese juego.</div></section>
<footer>GameSearch · Thriller Games · Tu portal de juegos</footer>
</main>

<div id="snakeView" style="display:none;max-width:1100px;margin:0 auto;padding:30px 22px 70px">
  <button class="cat" onclick="closeSnake()">← Volver a juegos</button>
  <h2 id="gameTitle" style="margin:22px 0 14px">🎮 Juego</h2>
  <div id="nativeSnake" style="display:none;text-align:center">
    <div id="score" style="color:#ff914d;font-weight:800;margin-bottom:12px">Puntos: 0</div>
    <canvas id="snakeCanvas" width="500" height="400" style="max-width:100%;background:#050505;border:2px solid #ff6a00;border-radius:12px"></canvas>
    <p style="color:#999">Usa las flechas del teclado para moverte.</p>
  </div>
  <div id="embedGame" style="display:none">
    <iframe id="gameFrame" src="about:blank" title="1v1.LOL" style="width:100%;height:70vh;min-height:520px;border:2px solid #ff6a00;border-radius:12px;background:#000" allowfullscreen></iframe>
  </div>
</div>
<script>
const games=[
 {name:"Snake.io",cat:"Acción",icon:"🐍",desc:"El clásico juego de serpiente, dentro de Thriller Games."},
 {name:"1v1.LOL",cat:"Acción",icon:"🎮",desc:"Juega 1v1.LOL dentro de Thriller Games."}
];
let cat="Todos";
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=games.filter(g=>(cat==="Todos"||g.cat===cat)&&g.name.toLowerCase().includes(q));
 document.getElementById("grid").innerHTML=list.map(g=>`<article class="card"><div class="icon">${g.icon}</div><h3>${g.name}</h3><p>${g.desc}</p><div class="row"><span class="tag">${g.cat}</span><button class="play" onclick="openGame('${g.name}')">Jugar</button></div></article>`).join("");
 document.getElementById("count").textContent=list.length+" juegos";
 document.getElementById("empty").style.display=list.length?"none":"block";
 const results=document.getElementById("browserResults");
 if(q){
   results.innerHTML=`<div style="background:#121212;border:1px solid #292929;border-radius:14px;padding:18px;color:#aaa">
<div style="font-size:13px;margin-bottom:12px">Resultados de Thriller Browser</div>
<div style="font-size:20px;color:#fff;margin-bottom:7px">${q}</div>
<a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" style="color:#ff914d;text-decoration:none">Buscar "${q}" en Google ↗</a>
</div>`;
 } else results.innerHTML="";
}
function buscar(){render()}
document.getElementById("search").addEventListener("input",render);
document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");cat=b.dataset.cat;render()});
render();

const canvas=document.getElementById("snakeCanvas"),ctx=canvas.getContext("2d");
let snake,food,dx,dy,scoreValue,loop;
function openGame(name){
 if(name==="1v1.LOL"){
   clearInterval(loop);
   document.getElementById("snakeView").style.display="block";
   document.getElementById("juegos").style.display="none";
   document.getElementById("categorias").style.display="none";
   document.querySelector(".hero").style.display="none";
   document.getElementById("nativeSnake").style.display="none";
   document.getElementById("embedGame").style.display="block";
   document.getElementById("gameTitle").textContent="🎮 1v1.LOL";
   document.getElementById("gameFrame").src="https://1v1lol-free.github.io/";
   window.scrollTo({top:0,behavior:"smooth"});
 } else {
   openSnake();
 }
}
function openSnake(){
 document.getElementById("snakeView").style.display="block";
 document.getElementById("juegos").style.display="none";
 document.getElementById("categorias").style.display="none";
 document.querySelector(".hero").style.display="none";
 startSnake();
 window.scrollTo({top:0,behavior:"smooth"});
}
function closeSnake(){
 clearInterval(loop);
 if(document.getElementById("gameFrame")) document.getElementById("gameFrame").src="about:blank";
 if(document.getElementById("embedGame")) document.getElementById("embedGame").style.display="none";
 if(document.getElementById("nativeSnake")) document.getElementById("nativeSnake").style.display="block";
 document.getElementById("snakeView").style.display="none";
 document.getElementById("juegos").style.display="block";
 document.getElementById("categorias").style.display="flex";
 document.querySelector(".hero").style.display="block";
}
function startSnake(){
 clearInterval(loop);
 snake=[{x:240,y:200},{x:220,y:200},{x:200,y:200}];
 dx=20;dy=0;scoreValue=0;placeFood();updateScore();draw();
 loop=setInterval(tick,100);
}
function placeFood(){
 food={x:Math.floor(Math.random()*25)*20,y:Math.floor(Math.random()*20)*20};
}
function tick(){
 const head={x:snake[0].x+dx,y:snake[0].y+dy};
 if(head.x<0||head.x>=500||head.y<0||head.y>=400||snake.some(s=>s.x===head.x&&s.y===head.y)){
   clearInterval(loop); alert("Game Over — puntos: "+scoreValue); return;
 }
 snake.unshift(head);
 if(head.x===food.x&&head.y===food.y){scoreValue++;placeFood();updateScore()}else snake.pop();
 draw();
}
function draw(){
 ctx.fillStyle="#050505";ctx.fillRect(0,0,500,400);
 ctx.strokeStyle="#151515";for(let x=0;x<500;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke()}for(let y=0;y<400;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(500,y);ctx.stroke()}
 ctx.fillStyle="#ff6a00";ctx.fillRect(food.x+2,food.y+2,16,16);
 snake.forEach((s,i)=>{ctx.fillStyle=i===0?"#ff914d":"#ff6a00";ctx.fillRect(s.x+2,s.y+2,16,16)});
}
function updateScore(){document.getElementById("score").textContent="Puntos: "+scoreValue}
document.addEventListener("keydown",e=>{
 if(document.getElementById("snakeView").style.display==="none")return;
 if(e.key==="ArrowUp"&&dy!==20){dx=0;dy=-20}
 if(e.key==="ArrowDown"&&dy!==-20){dx=0;dy=20}
 if(e.key==="ArrowLeft"&&dx!==20){dx=-20;dy=0}
 if(e.key==="ArrowRight"&&dx!==-20){dx=20;dy=0}
});

</script>
</body>
</html>
